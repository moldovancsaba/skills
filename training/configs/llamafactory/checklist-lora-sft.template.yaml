### model
model_name_or_path: /path/to/base-model
template: llama3
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora

### dataset
dataset_dir: /path/to/exported-datasets
dataset: checklist_sft_tasks,checklist_sft_flashcards
cutoff_len: 4096
max_samples: 5000
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /path/to/output/checklist-lora-sft
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
